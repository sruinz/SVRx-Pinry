[tool.poetry]
name = "pinry"
version = "2.1.9"
description = "Pinry, a tiling image board system for people who want to save, tag, and share images, videos and webpages in an easy to skim through format. It's open-source and self-hosted."
authors = ["winkidney <winkidney@gmail.com>"]
license = "BSD 2-Clause"

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
requests = "^2.27.1"
urllib3 = "==1.26.20"
django = "==5.2.17"
pillow = "==12.3.0"
markdown = "*"
django-filter = "==26.1"
coreapi = "^2.3.3"
psycopg2-binary = "2.9.9"
django-taggit = "6.1.0"
django-braces = "^1.15.0"
django-compressor = "==4.6.0"
mock = "^4.0.3"
gunicorn = "^20.1.0"
djangorestframework = "==3.16.1"


[tool.poetry.dev-dependencies]
flake8 = "==7.3.0"
qrcode = "*"
django-extensions = "*"
mkdocs = "*"
mkdocs-material = "*"
jinja2 = "==3.1.2"
black = "==26.5.1"

[tool.poetry.group.dev.dependencies]
jinja2 = "3.1.2"
mkdocs-material = "8.4.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "tuna"
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple/"
priority = "primary"
