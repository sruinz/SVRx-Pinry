<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>관리자 인증 복구</title></head>
<body><main><h1>관리자 인증 복구</h1>
<p>내부망에서 활성 슈퍼 관리자 계정과 비밀번호로 로그인하세요. 복구 세션은 15분 후 만료됩니다.</p>
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form method="post">{% csrf_token %}
<p><label>계정 <input name="username" maxlength="150" autocomplete="username" required></label></p>
<p><label>비밀번호 <input type="password" name="password" autocomplete="current-password" required></label></p>
<button type="submit">복구 로그인</button></form></main></body></html>
