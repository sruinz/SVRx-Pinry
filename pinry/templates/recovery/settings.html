<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>인증 정책 복구</title></head>
<body><main><h1>인증 정책 복구</h1>
<p>비밀번호 로그인을 다시 허용한 뒤 일반 관리자 화면에서 SSO 제공자를 수정할 수 있습니다.</p>
<p>허용 CIDR은 RFC1918 또는 IPv6 ULA의 필요한 대역만 입력하세요. NAS·게이트웨이·프록시 주소는 차단해야 합니다.
클라이언트 주소가 NAT로 가려진 경우 게이트웨이를 허용하지 말고 네트워크 경로를 먼저 구성하세요.</p>
<form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">인증 정책 저장</button></form>
<form method="post" action="{% url 'recovery:logout' %}">{% csrf_token %}<button type="submit">로그아웃</button></form>
</main></body></html>
