user www-data;
worker_processes 4;
pid /run/nginx.pid;

events {
	worker_connections 768;
}

http {
    # 외부 프록시 흔적을 앱에 전달한다. 클라이언트가 보낸 내부 경계 헤더는 덮어쓴다.
    map "$http_forwarded$http_x_forwarded_for$http_x_forwarded_proto$http_x_forwarded_host" $pinry_proxied {
        "" 0;
        default 1;
    }
    # 두 제어 경로 전체가 하나의 요청 예산을 공유한다.
    limit_req_zone $server_name zone=startup_recovery:1m rate=2r/s;
	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;
	keepalive_timeout 65;
	types_hash_max_size 2048;
	client_max_body_size 1m;

	server_names_hash_bucket_size 64;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	access_log /var/log/nginx/access.log;
	error_log /var/log/nginx/error.log;

	gzip on;
	gzip_disable "msie6";
	gzip_vary on;
	gzip_proxied any;
	gzip_comp_level 6;
	gzip_types text/plain text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript;

	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;
}
